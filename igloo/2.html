.projection { position:fixed; inset:0; overflow:hidden; background:#030b12; cursor:none; }
.overline { text-decoration:none; }
.projection > * { width:100%; height:100%; }
.wall-stage,.floor-stage { position:relative; width:100%; height:100%; overflow:hidden; isolation:isolate; background:#071522; }
.room-motion { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.wall-film { position:absolute; inset:0; width:100%; height:100%; }
.film-decoder { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
.cinema-grade { position:absolute; inset:0; background:linear-gradient(90deg,#02101bb8,transparent 32%,transparent 91%,#02101bb8),linear-gradient(0deg,#020e1ae8 0%,#0312217a 20%,transparent 58%,#020e1a36); }
.wall-copy { position:absolute; top:26%; left:2.5%; width:20%; max-width:20%; text-shadow:0 2px 18px #0007; }
.wall-kicker { display:flex; align-items:center; gap:.55em; font-size:clamp(8px,.66vw,24px); font-weight:700; letter-spacing:.18em; color:#f1f6f7; }
.wall-kicker strong { color:#ffe600; }
.ey-bar { width:1.15em; height:.22em; background:#ffe600; }
.wall-chapter-name { display:block; margin-top:1.4em; color:#d5e3e8; font-size:clamp(7px,.48vw,18px); font-weight:600; letter-spacing:.14em; }
.wall-copy h1 { margin:.28em 0 .3em; font-size:clamp(18px,2.2vw,100px); line-height:1.035; letter-spacing:-.055em; font-weight:700; text-wrap:balance; }
.wall-copy p { margin:0; max-width:96%; color:#ebf2f4; font-size:clamp(9px,.82vw,34px); line-height:1.4; }
.wall-footer { position:absolute; bottom:5.4%; left:2.5%; right:2.5%; display:flex; justify-content:space-between; font-size:clamp(8px,.52vw,20px); font-weight:700; letter-spacing:.16em; color:#d8e5eb; }
.wall-footer span:last-child { opacity:.63; }
.wall-benefits { position:absolute; left:27.5%; right:2.5%; bottom:17%; display:grid; grid-template-columns:repeat(3,1fr); gap:7%; }
.wall-benefit { display:flex; flex-direction:column; gap:.45em; }
.wall-benefit > span { width:2.1vw; height:2px; background:#ffe600; margin-bottom:.45em; box-shadow:0 0 12px #ffe60060; }
.wall-benefit small { color:#ffe600; font-size:clamp(7px,.53vw,20px); font-weight:700; letter-spacing:.16em; }
.wall-benefit strong { color:#f2f6f8; font-size:clamp(10px,.99vw,40px); max-width:83%; font-weight:500; letter-spacing:-.02em; line-height:1.25; text-wrap:balance; }
.wall-stage.compact .wall-copy h1 { font-size:clamp(12px,1.54vw,25px); }
.wall-stage.compact .wall-copy p { font-size:clamp(6px,.58vw,10px); }
.wall-stage.compact .wall-kicker { font-size:clamp(5px,.45vw,8px); }
.wall-stage.compact .wall-chapter-name { font-size:clamp(4px,.33vw,6px); }
.wall-stage.compact .wall-footer { font-size:clamp(5px,.39vw,7px); }
.wall-stage.compact .wall-benefit small { font-size:clamp(4px,.36vw,7px); }
.wall-stage.compact .wall-benefit strong { font-size:clamp(7px,.74vw,13px); }
.wall-stage.compact .wall-benefit > span { height:1px; }
.animated-floor { background:#040e17; container-type:size; }
.floor-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.4cqh; text-align:center; pointer-events:none; text-shadow:0 2px 35px #020a16; }
.floor-center-eyebrow { color:#e7ece3; font-size:1.7cqh; letter-spacing:.33em; font-weight:600; }
.floor-center strong { color:#fff0a0; font-size:17cqh; line-height:1; font-weight:500; letter-spacing:-.065em; }
.floor-close-line { color:#f7f0d0; font-size:2.4cqh; font-weight:400; letter-spacing:.02em; }
.tone-outro .floor-center strong { font-size:23cqh; color:#ffe56c; text-shadow:0 0 80px #ffce4b28; }
.floor-edge-label { position:absolute; left:8%; right:8%; text-align:center; font-size:1.45cqh; font-weight:600; letter-spacing:.24em; color:#c1d9dd; display:flex; flex-direction:column; align-items:center; gap:1.8cqh; }
.floor-edge-label > span { width:4.5%; height:1px; background:#ffe56c; }
.edge-near { bottom:7%; }
.edge-far { top:7%; transform:rotate(180deg); opacity:.45; }
.floor-perimeter { position:absolute; inset:3.5%; border:1px solid #87bac114; border-radius:2px; pointer-events:none; }
.floor-row { display:block; padding:0; background:#121b24; }
